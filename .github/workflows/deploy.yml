# Builds the dashboard and publishes it to GitHub Pages whenever the app or the data changes.
# Enable once in the repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/latest.json', 'pipeline/src/**', '.github/workflows/deploy.yml', 'package*.json']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test pipeline
        run: npm test
      - name: Build
        env:
          # Project pages are served at https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
        run: npm run build
      - name: Configure Pages (creates the site on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
