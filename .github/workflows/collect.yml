# Scheduled cloud collection: runs the pipeline on GitHub's runners, commits the new data
# (observations history, scores history, latest snapshot) back to the repository, and then
# the deploy workflow publishes the dashboard. Nothing runs on any personal machine.
name: Collect trends

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs by several minutes under load.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}   # "Manual refresh" — from the Actions tab or the dashboard's Settings page

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Collect
        env:
          # Optional. Free YouTube Data API v3 key (10,000 units/day). Without it the YouTube
          # source is reported as "disabled" and the dashboard still works from the other sources.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VR_GT_REGIONS: ${{ vars.VR_GT_REGIONS || 'US,GB,CA,AU' }}
          VR_YT_REGIONS: ${{ vars.VR_YT_REGIONS || 'US,GB,CA,AU' }}
          VR_YT_QUERIES: ${{ vars.VR_YT_QUERIES || 'animation short,funny cat,ai animation,comedy skit,music parody,animated short film' }}
          VR_TIKTOK: ${{ vars.VR_TIKTOK || '0' }}
          VR_MASTODON_INSTANCES: ${{ vars.VR_MASTODON_INSTANCES || 'mastodon.social' }}
        run: npm run collect

      - name: Commit data
        run: |
          git config user.name "viral-radar-bot"
          git config user.email "viral-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: collection $(date -u +'%Y-%m-%dT%H:%MZ')"
            # retry push in case another run landed first
            for i in 1 2 3; do git push && break || (git pull --rebase && sleep 5); done
          fi

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the collector publishes
  # the refreshed dashboard itself.
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
        run: npm run build -w web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
