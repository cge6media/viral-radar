# Scheduled cloud collection (Viral Radar 2.0): runs the pipeline on GitHub's runners, commits the data
# (observation history, score history, quality report, YouTube quota ledger, latest snapshot), checks the
# release gate, and publishes the dashboard to GitHub Pages. Nothing runs on any personal machine.
name: Collect trends

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch: {}      # manual refresh from the Actions tab

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts

      - name: Collect
        env:
          # Free YouTube Data API v3 key (10,000 units/day for videos.list etc.; search.list has its own 100 calls/day).
          # Without it the YouTube source is reported as "disabled"; nothing is fabricated.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VR_GT_REGIONS: ${{ vars.VR_GT_REGIONS || 'US,GB,CA,AU' }}
          VR_YT_REGIONS: ${{ vars.VR_YT_REGIONS || 'US,GB' }}
          VR_YT_CHART_CATEGORIES: ${{ vars.VR_YT_CHART_CATEGORIES || '1,10,15,20,23,24' }}
          VR_YT_DISCOVERY_HOURS: ${{ vars.VR_YT_DISCOVERY_HOURS || '6' }}
          VR_YT_SEARCH_BUDGET: ${{ vars.VR_YT_SEARCH_BUDGET || '90' }}
          VR_YT_QUERIES: ${{ vars.VR_YT_QUERIES }}
          VR_BSKY_QUERIES: ${{ vars.VR_BSKY_QUERIES }}
          VR_TIKTOK: ${{ vars.VR_TIKTOK || '0' }}
          VR_MASTODON_INSTANCES: ${{ vars.VR_MASTODON_INSTANCES || 'mastodon.social' }}
        run: npm run collect

      - name: Release gate (critical data-integrity checks)
        id: gate
        run: |
          if npx tsx pipeline/src/gate.ts; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Commit data
        run: |
          git config user.name "viral-radar-bot"
          git config user.email "viral-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: collection $(date -u +'%Y-%m-%dT%H:%MZ') (gate: ${{ steps.gate.outputs.publish }})"
            for i in 1 2 3; do git push && break || (git pull --rebase && sleep 5); done
          fi

      - name: Report
        run: |
          echo "## Collection summary" >> "$GITHUB_STEP_SUMMARY"
          node -e "const s=require('./data/latest.json'); console.log('- generated', s.generatedAt); for (const x of s.sources) console.log('- '+x.source+': '+x.mode+' '+x.items+' items'+(x.error?' ('+x.error.slice(0,80)+')':'')); console.log('- trends', s.trends.length, 'qualified', s.stats.qualifiedTrends); for (const c of s.quality.checks) console.log('- '+(c.ok?'✅':'❌')+' '+c.name+' — '+c.detail);" >> "$GITHUB_STEP_SUMMARY"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the collector publishes the refreshed
  # dashboard itself — only when the release gate passed. A skipped publish keeps the previous release live.
  publish:
    needs: collect
    if: needs.collect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
        run: npm run build -w web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
