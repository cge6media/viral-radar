# Scheduled cloud collection (Viral Radar 4.0): runs the pipeline on GitHub's runners, commits the data
# (observation history, score history, predictions, quality report, YouTube quota + yield ledgers, latest snapshot),
# checks the release gate, and publishes the dashboard to GitHub Pages. Nothing runs on any personal machine.
#
# Reliability (4.0): GitHub drops or delays scheduled runs under load (measured 2026-10-28: 53 % of 30-minute slots
# started, 8–23 min late, and in practice at most ONE scheduled run per workflow per hour). Four sibling workflows
# (this one + collect-b/c/d.yml, staggered every ~8 minutes; generated copies of this file with their own cron — GitHub
# does not start a reusable workflow from a scheduled caller reliably) therefore each carry their own schedule; every
# scheduled run first checks how old the published data is — younger than 22 minutes → it exits without collecting —
# so collectors never overlap, the quota ledger stays consistent, and the effective cadence approaches 30 minutes
# whichever slots GitHub honours. Keep the four files identical except for `name` and `cron` (see scripts/sync-schedules.mjs).
# 4.0.1: because GitHub then honoured only ~1 slot per hour across all four workflows, every scheduled or chained run
# also starts a `keeper` job that waits 25 minutes and dispatches the next collection itself (see the job's comment).
name: Collect trends

on:
  schedule:
    - cron: '3,33 * * * *'
  workflow_dispatch:         # manual refresh from the Actions tab (never skipped by the freshness gate) — or the keeper
    inputs:
      chain:
        description: 'true when dispatched by the keeper job (the freshness gate then applies)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # 2026-10-30 repair: the pipeline took 3–5 min until a quadratic clustering step grew with the 7-day window and
    # pushed runs past 20 min (cancelled as timeouts, half of the rest failing at the push). The step is fixed
    # (seconds again); the limit keeps headroom and the stage timings in data/health.json show where a slow run spends it.
    timeout-minutes: 30
    # job-level, not workflow-level: the sleeping keeper job must not hold the group and delay a scheduled collection
    concurrency:
      group: collect
      cancel-in-progress: false
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      skipped: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued job starts the second the previous one finishes, and its checkout can miss a push made seconds
      # earlier (29 of the repair-day failures: a stale checkout ran the whole pipeline, then its push was rejected).
      # Re-fetch after a short pause and work from the true tip of main.
      - name: Sync to the tip of main
        run: |
          sleep 15
          git fetch -q origin main
          git reset -q --hard origin/main
          echo "head: $(git rev-parse --short HEAD) — $(git log -1 --format=%s)"

      - name: Freshness gate (skip when the last collection is < 22 min old)
        id: fresh
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.chain }}" = "true" ]; } && [ -f data/latest.json ]; then
            AGE=$(node -e "const s=require('./data/latest.json'); console.log(Math.round((Date.now()-new Date(s.generatedAt).getTime())/60000))")
            echo "last collection is ${AGE} min old"
            if [ "$AGE" -lt 22 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::skipped — data is ${AGE} min old"; exit 0; fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.fresh.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Export the Actions run history (dropped scheduled runs are only visible here)
        if: steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/health
          : > data/health/actions.tmp
          for wf in collect.yml collect-b.yml collect-c.yml collect-d.yml; do
            gh run list --workflow "$wf" --limit 100 --json createdAt,startedAt,updatedAt,event,status,conclusion \
              --jq ".[] | {workflow: \"$wf\", createdAt, event, status, conclusion, durationSec: (if .startedAt and .updatedAt then (((.updatedAt|fromdateiso8601) - (.startedAt|fromdateiso8601))) else null end)}" >> data/health/actions.tmp || true
          done
          node -e "const fs=require('fs'); const rows=fs.readFileSync('data/health/actions.tmp','utf8').split('\n').filter(Boolean).map((l)=>JSON.parse(l)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)); fs.writeFileSync('data/health/actions.json', JSON.stringify(rows.slice(0,300)));" || echo "[]" > data/health/actions.json
          rm -f data/health/actions.tmp
          node -e "const a=require('./data/health/actions.json'); console.log('actions history:', a.length, 'runs')"

      - name: Collect
        if: steps.fresh.outputs.skip != 'true'
        env:
          # Free YouTube Data API v3 key (10,000 units/day for videos.list etc.; search.list has its own 100 calls/day).
          # Without it the YouTube source is reported as "disabled"; nothing is fabricated.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VR_GT_REGIONS: ${{ vars.VR_GT_REGIONS || 'US,GB,CA,AU' }}
          VR_YT_REGIONS: ${{ vars.VR_YT_REGIONS || 'US,GB' }}
          VR_YT_CHART_CATEGORIES: ${{ vars.VR_YT_CHART_CATEGORIES || '1,10,15,20,23,24' }}
          VR_YT_MAX_SEARCHES_PER_RUN: ${{ vars.VR_YT_MAX_SEARCHES_PER_RUN || '4' }}
          VR_YT_SEARCH_BUDGET: ${{ vars.VR_YT_SEARCH_BUDGET || '90' }}
          VR_YT_QUERIES: ${{ vars.VR_YT_QUERIES }}
          VR_BSKY_QUERIES: ${{ vars.VR_BSKY_QUERIES }}
          VR_TIKTOK: ${{ vars.VR_TIKTOK || '0' }}
          VR_MASTODON_INSTANCES: ${{ vars.VR_MASTODON_INSTANCES || 'mastodon.social' }}
          VR_SCHEDULE: '4 schedules × 2 slots/hour (3,33 · 18,48 · 11,41 · 26,56), gated to ≥22 min'
          VR_TARGET_COLLECTIONS_PER_DAY: '48'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run collect

      - name: Release gate (critical data-integrity checks)
        id: gate
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if npx tsx pipeline/src/gate.ts; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

      - name: Commit data
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "viral-radar-bot"
          git config user.email "viral-radar-bot@users.noreply.github.com"
          # "takeours" (.gitattributes): a regenerated JSON file takes the replayed commit's version whole during the rebase
          git config merge.takeours.name "take the replayed run's file"
          git config merge.takeours.driver "cp %B %A"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "data: collection $(date -u +'%Y-%m-%dT%H:%MZ') (gate: ${{ steps.gate.outputs.publish }})"
          # If main moved while this run worked, replay our data commit on top of it: append-only logs (NDJSON) merge
          # by union (.gitattributes), regenerated files take this run's version (-X theirs = the commit being replayed).
          # Five attempts with a growing pause; a conflict that survives the strategies is a genuine failure.
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected (attempt $i) — rebasing onto the current main"
            git fetch -q origin main
            if ! git rebase -q -X theirs origin/main; then
              echo "::warning::rebase conflict — resolving with this run's data"
              git checkout --theirs -- data 2>/dev/null || true
              git add data
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "::error::could not replay the data commit"; exit 1; }
            fi
            sleep $((i * 10))
          done
          echo "::error::push failed after 5 attempts"
          exit 1

      - name: External alerts (optional; needs the ALERT_WEBHOOK_URL secret and VR_ALERT_WEBHOOK=1)
        if: steps.fresh.outputs.skip != 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          VR_ALERT_WEBHOOK: ${{ vars.VR_ALERT_WEBHOOK || '0' }}
        run: npx tsx pipeline/src/tools/notify.ts

      - name: Report
        if: steps.fresh.outputs.skip != 'true'
        run: |
          echo "## Collection summary" >> "$GITHUB_STEP_SUMMARY"
          node -e "const s=require('./data/latest.json'); console.log('- generated', s.generatedAt); for (const x of s.sources) console.log('- '+x.source+': '+x.mode+' '+x.items+' items'+(x.error?' ('+x.error.slice(0,80)+')':'')); console.log('- trends', s.trends.length, 'qualified', s.stats.qualifiedTrends); if (s.desk) console.log('- desk:', s.desk.opportunities.map(o=>o.action+' '+o.name).join('; ')); if (s.scorecard) console.log('- predictions', s.scorecard.predictions, 'pending horizons', s.scorecard.pending, 'evaluated', s.scorecard.evaluated); if (s.health) console.log('- health: collections 24h', s.health.last24h.collections, 'start rate', s.health.last24h.startRate); for (const c of s.quality.checks) console.log('- '+(c.ok?'✅':'❌')+' '+c.name+' — '+c.detail);" >> "$GITHUB_STEP_SUMMARY"

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the collector publishes the refreshed
  # dashboard itself — only when the release gate passed. A skipped publish keeps the previous release live.
  # The front-end build is cached by source hash: an unchanged app is not rebuilt, only its data files are refreshed.
  publish:
    needs: collect
    if: needs.collect.outputs.publish == 'true' && needs.collect.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore the built app (keyed by the app's source)
        id: dist
        uses: actions/cache@v4
        with:
          path: web/dist
          key: web-dist-${{ hashFiles('web/src/**', 'web/index.html', 'web/vite.config.ts', 'web/tsconfig*.json', 'web/package.json', 'pipeline/src/types.ts', 'pipeline/src/intel/taxonomy.ts', 'package-lock.json') }}
      - uses: actions/setup-node@v4
        if: steps.dist.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.dist.outputs.cache-hit != 'true'
      - name: Build
        if: steps.dist.outputs.cache-hit != 'true'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
        run: npm run build -w web
      - name: Copy data into the build
        run: |
          mkdir -p web/dist/data/predictions web/dist/data/diagnostics web/dist/data/benchmark
          cp data/latest.json data/videos.json web/dist/data/
          cp data/health.json web/dist/data/ 2>/dev/null || true
          cp data/benchmark/latest.json web/dist/data/benchmark/ 2>/dev/null || true
          cp data/predictions/scorecard.json web/dist/data/predictions/ 2>/dev/null || true
          cp data/diagnostics/discovery-yield.json web/dist/data/diagnostics/ 2>/dev/null || true
          ls -la web/dist/data
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # 4.0.1 reliability: even with four staggered workflows GitHub honoured 1 of 6 scheduled slots between 12:27 and
  # 13:10 UTC on 2026-10-28, so a collection now schedules the next one itself — wait 25 minutes, then dispatch
  # collect.yml with chain=true (the freshness gate applies, so a scheduled run that happened meanwhile makes the
  # chained run a no-op). Runs on every scheduled or chained run, also after a failed collection (the chain survives
  # failures); manual dispatches do not start chains. Public-repository Actions minutes are free; a sleeping runner
  # costs nothing but is the price of a cadence GitHub's scheduler does not provide. Disable by disabling this workflow.
  keeper:
    needs: collect
    if: always() && (github.event_name == 'schedule' || inputs.chain == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
    steps:
      - name: Wait 25 minutes, then dispatch the next collection unless one started meanwhile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          # a collection run created in the last 10 minutes (any status) means the schedule or another keeper got there first;
          # sleeping keepers belong to runs created ≥25 minutes ago, so they do not count, and neither does this run
          RECENT=$(gh run list --repo "${{ github.repository }}" --limit 20 --json databaseId,workflowName,createdAt --jq '[.[] | select((.workflowName | startswith("Collect trends")) and (.databaseId != ${{ github.run_id }}) and ((now - (.createdAt | fromdateiso8601)) < 600))] | length')
          if [ "$RECENT" != "0" ]; then echo "::notice::a collection started or is running meanwhile — not dispatching"; exit 0; fi
          # and published data younger than 20 minutes means there is nothing to chase yet
          AGE=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/data/health.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const h=JSON.parse(s);console.log(Math.round((Date.now()-new Date(h.lastCollectionAt).getTime())/60000))})" 2>/dev/null || echo 999)
          if [ "$AGE" -lt 20 ]; then echo "::notice::last collection is ${AGE} min old — not dispatching"; exit 0; fi
          gh workflow run collect.yml --repo "${{ github.repository }}" -f chain=true
          echo "::notice::next collection dispatched"
